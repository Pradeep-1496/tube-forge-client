name: Deploy Angular to Public URL

on:
  push:
    branches: [ main ] # Runs automatically every time you push code to main

permissions:
  contents: write # Allows GitHub to create the public hosting branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      # Compiles the project for the web
      - name: Build Angular App
        run: npm run build

      # Automatically moves the built files to the public hosting area
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist/
          branch: gh-pages
